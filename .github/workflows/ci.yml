name: CI

on:
  push:
    branches: [main, cpp17-reference]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev zlib1g-dev libtinyxml2-dev curl

      # search_server 依赖 Sogou Workflow 与 wfrest，二者都需要源码安装
      - name: Install workflow + wfrest
        run: |
          git clone --depth 1 https://github.com/sogou/workflow.git /tmp/workflow
          make -C /tmp/workflow -j"$(nproc)" && sudo make -C /tmp/workflow install
          git clone --depth 1 https://github.com/wfrest/wfrest.git /tmp/wfrest
          make -C /tmp/wfrest -j"$(nproc)" && sudo make -C /tmp/wfrest install
          sudo ldconfig

      - name: Configure & build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          test -x bin/search_server   # wfrest 已安装，HTTP 服务必须被构建出来

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Offline build (RSS sample + mock BigQuery export)
        run: |
          python3 scripts/gen_mock_corpus.py --docs 5000
          ./bin/build_index conf/search.conf

      - name: Online smoke test
        run: |
          ./bin/search_server conf/search.conf &
          SERVER_PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/ >/dev/null && break; sleep 1; done

          # 默认 listen_host = 127.0.0.1：只能监听在回环地址上，不能是 0.0.0.0
          ss -ltn | tee listen.txt
          grep -q '127.0.0.1:9000' listen.txt
          ! grep -qE '(0\.0\.0\.0|\*|\[::\]):9000' listen.txt

          curl -sf --get http://127.0.0.1:9000/search    --data-urlencode "query=海洋经济" | tee search.json
          curl -sf --get http://127.0.0.1:9000/recommend --data-urlencode "query=中"       | tee recommend.json
          python3 -c "import json; r=json.load(open('search.json'));    assert r and 'title' in r[0], r"
          python3 -c "import json; r=json.load(open('recommend.json')); assert r and r[0].startswith('中'), r"

          # /stats：索引规模，四个字段都是正整数
          curl -sf http://127.0.0.1:9000/stats | tee stats.json
          python3 -c "import json; r=json.load(open('stats.json')); assert all(isinstance(r[k], int) and r[k] > 0 for k in ('documents', 'terms', 'postings', 'suggest_words')), r"

          # 畸形输入必须得到 400，而不是把进程打挂
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:9000/search?query=%zz')" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:9000/search')" = 400
          curl -sf --get http://127.0.0.1:9000/search --data-urlencode "query=经济" >/dev/null

          kill -INT "$SERVER_PID"
          wait "$SERVER_PID"   # 优雅退出，返回码应为 0

      # fd 上限不够时不能“带病启动”：软上限不够要自己提高，硬上限也不够要拒绝启动
      - name: fd limit handling
        run: |
          sed 's/^max_connections = .*/max_connections = 5000/' conf/search.conf > conf/ci-fd.conf

          # 硬上限 1024 < 5000 + 64：必须以非 0 退出，并且说明原因
          ( ulimit -n 1024; ./bin/search_server conf/ci-fd.conf ) > refuse.log 2>&1 && { echo "server should have refused to start"; exit 1; }
          grep -q 'fd hard limit' refuse.log

          # 只降低软上限（-S），硬上限保持 runner 的默认值（远大于 5064）：服务要自己把软上限提到 5064 后正常启动
          ( ulimit -Sn 1024; exec ./bin/search_server conf/ci-fd.conf ) > raise.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/ >/dev/null && break; sleep 1; done
          grep -q 'fd soft limit raised from 1024 to 5064' raise.log
          grep 'Max open files' /proc/$SERVER_PID/limits | grep -q 5064
          kill -INT "$SERVER_PID"
          wait "$SERVER_PID"

      # preload_index = true：后台预读线程要能正常跑完，服务照常应答、照常优雅退出
      - name: Index preload
        run: |
          sed 's/^preload_index = .*/preload_index = true/' conf/search.conf > conf/ci-preload.conf
          ./bin/search_server conf/ci-preload.conf > preload.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/ >/dev/null && break; sleep 1; done
          curl -sf --get http://127.0.0.1:9000/search --data-urlencode "query=经济" >/dev/null
          for i in $(seq 1 30); do grep -q 'index preload finished' preload.log && break; sleep 1; done
          grep 'index preload finished' preload.log
          kill -INT "$SERVER_PID"
          wait "$SERVER_PID"
