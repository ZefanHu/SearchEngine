# =============================================================================
# SearchEngine 配置文件
#   - 格式：key = value，'#' 开头为注释
#   - 所有相对路径都相对于“本配置文件所在目录”解析，因此程序可以在任意目录启动
# =============================================================================

# ---- 分词器 (cppjieba) 词典 ----
jieba_dict       = ../data/jieba/jieba.dict.utf8
jieba_hmm        = ../data/jieba/hmm_model.utf8
jieba_user_dict  = ../data/jieba/user.dict.utf8
jieba_idf        = ../data/jieba/idf.utf8
jieba_stop_words = ../data/jieba/stop_words.utf8

# ---- 停用词（多个文件用逗号分隔）----
stop_word_files = ../data/stopwords/zh.txt, ../data/stopwords/en.txt

# ---- 离线建库 ----
# 语料目录：递归扫描。*.jsonl / *.ndjson / *.json 按 BigQuery 导出的 NDJSON 解析，*.xml 按 RSS 解析
corpus_dir = ../data/corpus
# 索引输出目录：pages.dat / pages.idx / index.dat / dict.dat
index_dir  = ../data/index
# 建库线程数，0 = 使用全部 CPU 核心
build_threads = 0
# 每批并行处理的文档数
build_batch_size = 2048
# SimHash 去重的海明距离阈值（0~3）
simhash_max_distance = 3
# 联想词典只收录文档频率 >= 该值的词
suggest_min_df = 2

# ---- 在线服务 ----
port = 9000
# 网页检索返回条数 / 关键词联想返回条数
search_top_k  = 10
suggest_top_k = 10
# 摘要长度（字节，按 UTF-8 字符边界截断）
snippet_bytes = 300
# LRU 缓存：总容量（条）与分片数
cache_capacity = 20000
cache_shards   = 16
# 首页静态文件
web_index = ../web/index.html
