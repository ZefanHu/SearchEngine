<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SearchEngine</title>

  <style>
    /* ========== 重置 / 基础排版 ========== */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                   Roboto, Helvetica, Arial, sans-serif;
      color: #1f2328;
      background: #fafbfc;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { color: inherit; text-decoration: none; }

    /* ==========  外层容器：用 padding-top 做"居中 → 顶部"的过渡 ========== */
    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: calc(40vh - 80px) 20px 80px;
      transition: padding-top 0.45s cubic-bezier(.2, .9, .3, 1);
    }
    body.searched .app {
      padding-top: 28px;
    }

    /* ========== 站点标题 ==========
       初始巨大居中，进入搜索状态后缩小并左对齐 */
    .brand {
      margin: 0 0 32px;
      font-size: 64px;
      font-weight: 600;
      letter-spacing: -1px;
      color: #111;
      text-align: center;
      transition: font-size 0.45s cubic-bezier(.2, .9, .3, 1),
                  margin    0.45s cubic-bezier(.2, .9, .3, 1),
                  text-align 0s 0.2s;
    }
    body.searched .brand {
      font-size: 26px;
      margin: 0 0 16px;
      text-align: left;
    }

    /* ========== 搜索框 ========== */
    .search-box { position: relative; }

    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 28px;
      padding: 4px 6px 4px 22px;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.06);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .search-row:focus-within {
      border-color: #2563eb;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.12);
    }
    .search-input {
      flex: 1;
      min-width: 0;          /* 防止 flex 收缩问题 */
      border: 0;
      outline: 0;
      background: transparent;
      color: inherit;
      font-size: 16px;
      padding: 12px 0;
    }
    .search-btn {
      border: 0;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      padding: 9px 22px;
      border-radius: 22px;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.08s ease;
    }
    .search-btn:hover  { background: #1d4ed8; }
    .search-btn:active { transform: scale(0.97); }

    /* ========== 推荐下拉 ========== */
    .dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      max-height: 360px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(32, 33, 36, 0.10);
      display: none;
      z-index: 50;
    }
    .dropdown.show { display: block; }
    .dropdown-item {
      padding: 10px 22px;
      font-size: 15px;
      color: #334155;
      cursor: pointer;
      transition: background-color 0.12s ease;
    }
    .dropdown-item:hover,
    .dropdown-item.active {
      background: #f1f5f9;
    }

    /* ========== 提示文案，搜索后隐藏 ========== */
    .hint {
      margin-top: 14px;
      text-align: center;
      color: #94a3b8;
      font-size: 12.5px;
    }
    body.searched .hint { display: none; }

    /* ========== 结果列表 ========== */
    .results { margin-top: 24px; }

    .result-card {
      padding: 18px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .result-card:last-child { border-bottom: 0; }

    .result-title {
      display: inline-block;
      font-size: 19px;
      font-weight: 500;
      line-height: 1.4;
      color: #1d4ed8;
    }
    .result-title:hover { text-decoration: underline; }

    .result-url {
      display: block;
      margin-top: 4px;
      color: #16a34a;
      font-size: 13px;
      word-break: break-all;
    }

    .result-content {
      margin: 8px 0 0;
      color: #475569;
      font-size: 14.5px;
      line-height: 1.65;
      /* 三行截断 */
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ========== 状态块（loading / empty / error 通用） ========== */
    .state {
      padding: 56px 0;
      text-align: center;
      color: #6b7280;
      font-size: 15px;
    }
    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      margin-bottom: 12px;
      border: 3px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div class="app">
    <h1 class="brand">Search</h1>

    <div class="search-box">
      <!-- form 让回车键自然触发 submit，无需手动监听 keypress -->
      <form class="search-row" id="search-form" autocomplete="off">
        <input
          id="search-input"
          class="search-input"
          type="text"
          placeholder="输入关键词，回车搜索"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="search-btn" type="submit">搜索</button>
      </form>

      <!-- 推荐词下拉，由 JS 动态填充 -->
      <div id="recommend-dropdown" class="dropdown" role="listbox"></div>
    </div>

    <p class="hint">提示：输入关键词时会智能补全相关词条</p>

    <!-- 结果区：状态块 / 卡片列表都渲染在这里 -->
    <section id="results" class="results"></section>
  </div>

  <script>
    'use strict';

    /* ========== DOM 引用 ========== */
    const $body     = document.body;
    const $form     = document.getElementById('search-form');
    const $input    = document.getElementById('search-input');
    const $dropdown = document.getElementById('recommend-dropdown');
    const $results  = document.getElementById('results');

    /* ========== 工具函数 ========== */

    // 防抖：在 wait 毫秒静默期内只执行最后一次调用
    function debounce(fn, wait) {
      let timer = null;
      return function (...args) {
        if (timer) clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), wait);
      };
    }

    // 服务端字段渲染前转义，避免 XSS
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,  '&amp;')
        .replace(/</g,  '&lt;')
        .replace(/>/g,  '&gt;')
        .replace(/"/g,  '&quot;')
        .replace(/'/g,  '&#39;');
    }

    /* ========== 推荐下拉 ========== */

    async function fetchRecommend(query) {
      try {
        const res = await fetch(`/recommend?query=${encodeURIComponent(query)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        return Array.isArray(data) ? data : [];
      } catch (err) {
        // 推荐失败属于次要功能，仅记录、不打扰用户
        console.warn('[recommend] failed:', err);
        return [];
      }
    }

    function renderDropdown(words) {
      if (!words.length) {
        hideDropdown();
        return;
      }
      $dropdown.innerHTML = words
        .map(w => `<div class="dropdown-item" role="option">${escapeHtml(w)}</div>`)
        .join('');
      $dropdown.classList.add('show');
    }

    function hideDropdown() {
      $dropdown.classList.remove('show');
      $dropdown.innerHTML = '';
    }

    // 输入事件 + 300ms 防抖
    const onInputDebounced = debounce(async () => {
      const q = $input.value.trim();
      if (!q) { hideDropdown(); return; }

      const words = await fetchRecommend(q);
      // 用户在请求过程中又改了输入，丢弃这次结果
      if (q !== $input.value.trim()) return;
      renderDropdown(words);
    }, 300);

    $input.addEventListener('input', onInputDebounced);

    // 点击下拉项 → 直接发起搜索
    $dropdown.addEventListener('click', (e) => {
      const item = e.target.closest('.dropdown-item');
      if (!item) return;
      $input.value = item.textContent;
      hideDropdown();
      doSearch();
    });

    // 失焦点击空白处关闭下拉
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-box')) hideDropdown();
    });

    // 键盘上下方向 + 回车选中下拉项
    $input.addEventListener('keydown', (e) => {
      if (!$dropdown.classList.contains('show')) return;
      const items = Array.from($dropdown.querySelectorAll('.dropdown-item'));
      if (!items.length) return;

      let idx = items.findIndex(it => it.classList.contains('active'));

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        idx = (idx + 1) % items.length;
        items.forEach(it => it.classList.remove('active'));
        items[idx].classList.add('active');
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        idx = (idx - 1 + items.length) % items.length;
        items.forEach(it => it.classList.remove('active'));
        items[idx].classList.add('active');
      } else if (e.key === 'Enter' && idx >= 0) {
        // 高亮项存在时，回车走"选中下拉项"分支，阻止 form 默认提交
        e.preventDefault();
        $input.value = items[idx].textContent;
        hideDropdown();
        doSearch();
      } else if (e.key === 'Escape') {
        hideDropdown();
      }
    });

    /* ========== 搜索主流程 ========== */

    async function fetchSearch(query) {
      const res = await fetch(`/search?query=${encodeURIComponent(query)}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      // 后端在空查询时返回 "No query result"（非 JSON），先尝试解析失败则视为空
      try {
        const data = JSON.parse(text);
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function showLoading() {
      $results.innerHTML = `
        <div class="state">
          <div class="spinner"></div>
          <div>正在搜索...</div>
        </div>`;
    }

    function showEmpty() {
      $results.innerHTML = `
        <div class="state">
          <div>未找到相关结果，换个关键词试试</div>
        </div>`;
    }

    function showError(msg) {
      $results.innerHTML = `
        <div class="state">
          <div>请求出错：${escapeHtml(msg)}</div>
        </div>`;
    }

    function renderResults(list) {
      if (!list || !list.length) return showEmpty();

      $results.innerHTML = list.map(item => {
        const title   = escapeHtml(item.title   || '(无标题)');
        const url     = escapeHtml(item.url     || '#');
        const content = escapeHtml(item.content || '');
        return `
          <article class="result-card">
            <a class="result-title"
               href="${url}"
               target="_blank"
               rel="noopener noreferrer">${title}</a>
            <span class="result-url">${url}</span>
            <p class="result-content">${content}</p>
          </article>`;
      }).join('');
    }

    async function doSearch() {
      const q = $input.value.trim();
      if (!q) return;

      hideDropdown();
      $body.classList.add('searched');   // 触发布局过渡
      showLoading();

      try {
        const list = await fetchSearch(q);
        renderResults(list);
      } catch (err) {
        showError(err.message || '未知错误');
      }
    }

    // 表单提交（按钮点击 / 输入框回车，没有 active 推荐项时）
    $form.addEventListener('submit', (e) => {
      e.preventDefault();
      doSearch();
    });

    // 页面加载完毕直接聚焦输入框
    $input.focus();
  </script>
</body>
</html>
